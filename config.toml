base_url = "https://www.skribisto.eu"
title = "Skribisto"
description = "A writing application for novels, essays and course notes. Free software, plain-text manuscripts, no account and no cloud."
default_language = "en"
author = "Cyril Jacquet"

compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
minify_html = true

# `zola check` runs in CI. Discord invite links answer 405 to a HEAD request.
[link_checker]
# Discord invite links answer 405 to a HEAD request. GitHub rewrites every
# heading id to `user-content-…` in the rendered page and scrolls to it with
# JavaScript, so its anchors are real in a browser but never found by a checker.
skip_prefixes = ["https://discord.gg/"]
skip_anchor_prefixes = ["https://github.com/"]

[markdown]
smart_punctuation = true

[extra]
github = "https://github.com/jacquetc/skribisto"
issues = "https://github.com/jacquetc/skribisto/issues"
discord = "https://discord.gg/5BSkvQmyVH"
manual = "https://manual.skribisto.eu/manual/"
faq = "https://manual.skribisto.eu/faq/"
help_repo = "https://github.com/jacquetc/skribisto-help-website"
contact = "cyril.jacquet@ferntech.eu"
trademark_contact = "trademarks@ferntech.eu"
flathub = "https://flathub.org/apps/eu.skribisto.skribisto"


name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deploy must never be cancelled half-way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.4"
  # sha256 of zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz. Zola publishes no
  # checksums, so this one was taken when the version was pinned: change both
  # lines together.
  ZOLA_SHA256: "54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSfL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar -xzf zola.tar.gz -C /usr/local/bin zola
          rm zola.tar.gz
          zola --version

      - name: Build
        run: zola build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public
          path: public
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public
          path: public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=skribisto
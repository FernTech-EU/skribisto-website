name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deploy must never be cancelled half-way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.4"
  # sha256 of zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz. Zola publishes no
  # checksums, so this one was taken when the version was pinned: change both
  # lines together.
  ZOLA_SHA256: "54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSfL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar -xzf zola.tar.gz -C /usr/local/bin zola
          rm zola.tar.gz
          zola --version

      - name: Build
        run: zola build

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public
          path: public
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
    steps:
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: public
          path: public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=skribisto
name: Sync release data

# Rebuilds data/release.toml and data/news.toml from what is actually published,
# then lets the deploy workflow pick the commit up. The download page therefore
# cannot advertise a version, an asset or a checksum that does not exist.
#
# To have a release update the site immediately instead of waiting for the daily
# run, add this step to the end of the release job in the application repository
# (needs a token with `contents: write` on this repository):
#
#   - name: Tell the website to resync
#     run: |
#       curl -sSf -X POST \
#         -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
#         -H "Accept: application/vnd.github+json" \
#         https://api.github.com/repos/FernTech-EU/skribisto-website/dispatches \
#         -d '{"event_type":"release-published"}'

on:
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rebuild the data files
        run: python3 scripts/sync_release_data.py --out data --static static

      # `static/` as well as `data/`: the script also writes
      # static/updates/stable.json, the feed the running application reads to
      # learn a newer version is out. Zola copies static/ verbatim into the
      # build, so committing it here is what publishes it.
      - name: Commit if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain data static)" ]; then
            echo "No change."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static
          git commit -m "chore(data): resync release, news and update-feed data from published releases"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own GITHUB_TOKEN fires no `push`
      # workflows (GitHub's recursion guard), so the deploy watching main never
      # sees the commit above and the site keeps serving the previous data.
      # workflow_dispatch is the documented exception to that guard: ask for
      # the deploy by name.
      - name: Trigger the deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

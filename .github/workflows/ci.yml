name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Once a week, so a link that rots on someone else's site is noticed here
    # rather than by a reader.
    - cron: "23 5 * * 1"
  workflow_dispatch:

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  site:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola

      - name: Build
        run: zola build

      - name: Check internal and external links
        run: zola check

  scripts:
    name: Test the release-data sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

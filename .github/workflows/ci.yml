name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Once a week, so a link that rots on someone else's site is noticed here
    # rather than by a reader.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.23.4"
  # sha256 of zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz. Zola publishes no
  # checksums, so this one was taken when the version was pinned: change both
  # lines together.
  ZOLA_SHA256: "54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de"

jobs:
  site:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSfL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar -xzf zola.tar.gz -C /usr/local/bin zola
          rm zola.tar.gz

      - name: Build
        run: zola build

      # GitHub sometimes answers a burst of link checks with 503 Service
      # Unavailable for a page that is there. A link is reported broken only if
      # it fails three times, a minute apart.
      - name: Check internal and external links
        run: |
          for attempt in 1 2 3; do
            zola check && exit 0
            [ "$attempt" = 3 ] || sleep 60
          done
          exit 1

  scripts:
    name: Test the release-data sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
